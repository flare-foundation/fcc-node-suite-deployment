apiVersion: v1
kind: Service
metadata:
  name: {{ include "tee_proxy.fullname" . }}-public
  labels:
    {{- include "tee_proxy.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.app.externalPort }}
      targetPort: {{ .Values.app.externalPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "tee_proxy.selectorLabels" . | nindent 4 }}