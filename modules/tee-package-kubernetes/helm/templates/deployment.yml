apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tee_proxy.fullname" . }}
  labels:
    {{- include "tee_proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tee_proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tee_proxy.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "tee_proxy.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.app.externalPort }}
              protocol: TCP
            - name: http-internal
              containerPort: {{ .Values.app.internalPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env: [
            {
              name: PRIVATE_KEY,
              value: "{{ .Values.privateKey }}"
            }
          ]
          # --- Probes ---
          startupProbe:
            httpGet:
              path: /startup
              port: 6661
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30  # retries before considering startup failed
          livenessProbe:
            httpGet:
              path: /healthy
              port: 6661
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 6661
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/config/config.toml
              subPath: config.toml
      volumes:
        - name: config
          secret:
            secretName: {{ include "tee_proxy.fullname" . }}-config
